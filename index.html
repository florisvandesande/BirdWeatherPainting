<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BirdWeather Painting</title>
    <link rel="stylesheet" href="assets/painting.css">
    <link rel="stylesheet" href="assets/collage.css">
    <link rel="stylesheet" href="assets/setup.css">
    <link rel="stylesheet" href="assets/artwork.css">
</head>
<body>
    <main id="painting" class="painting" aria-labelledby="plate-title" hidden>
        <section id="latest-plate" class="plate-content">
            <img id="latest-art" class="plate-art" src="assets/field-sprig.svg" alt="">
            <div class="plate-caption" aria-live="polite">
                <h1 id="plate-title" dir="auto"></h1>
                <p id="plate-detail" dir="auto"></p>
            </div>
        </section>
        <section id="collage" class="collage" hidden>
            <div id="collage-empty-state" class="collage-empty-state" hidden>
                <img id="collage-empty-art" class="collage-empty-art" alt="">
            </div>
            <div id="collage-board" class="collage-board"></div>
        </section>
        <div id="collage-omitted" class="visually-hidden"></div>
        <p id="observation-note" class="visually-hidden" role="status" hidden></p>
        <p id="connection-status" class="visually-hidden" role="status"></p>
        <button id="open-settings" class="painting-settings" type="button" aria-controls="setup">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
                <path d="M4 6h7m4 0h5M4 12h3m4 0h9M4 18h9m4 0h3" />
                <circle cx="13" cy="6" r="2" />
                <circle cx="9" cy="12" r="2" />
                <circle cx="15" cy="18" r="2" />
            </svg>
        </button>
        <button type="button" id="artwork-button" class="artwork-button" aria-controls="artwork-info" aria-expanded="false">i</button>
        <section id="artwork-info" class="artwork-info" role="dialog" aria-modal="true" aria-labelledby="artwork-title" hidden>
            <div class="artwork-sheet">
                <button type="button" id="artwork-close" data-artwork-text="back"></button>
                <h2 id="artwork-title" data-artwork-text="title"></h2>
                <p id="artwork-status" role="status" hidden></p>
                <button type="button" id="artwork-retry" hidden></button>
                <ul id="artwork-birds" class="artwork-birds"></ul>
                <footer class="artwork-attribution">
                    <span data-artwork-text="imageAttribution"></span>
                    <a href="https://github.com/arnegiacomo/fugleramme/blob/main/assets/artwork/classic/ATTRIBUTION.md"
                        target="_blank" rel="noopener noreferrer" data-artwork-text="imageSource"></a>
                    <span data-artwork-text="licenseAttribution"></span>
                    <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank"
                        rel="noopener noreferrer">CC BY-SA 4.0</a>
                </footer>
            </div>
        </section>
    </main>
    <main id="setup" class="setup" aria-labelledby="setup-title" hidden>
        <div class="setup-page">
            <header class="setup-header">
                <h1 id="setup-title" tabindex="-1" data-text="title"></h1>
                <p id="welcome-intro" data-text="welcomeIntro"></p>
            </header>
            <p id="url-config-status" class="setup-status" role="status"></p>
            <div class="setup-controls">
                <section class="setup-section" aria-labelledby="source-heading">
                    <h2 id="source-heading" data-text="sourceLabel"></h2>
                    <div class="setup-choice-buttons" role="group" aria-labelledby="source-heading">
                        <button id="use-location" type="button" data-text="useLocation"
                            aria-describedby="location-hint" aria-pressed="true"></button>
                        <button id="station-mode-button" type="button" data-text="enterStationId"
                            aria-pressed="false"></button>
                    </div>
                    <div id="nearby-source-settings">
                        <div class="coordinate-fields">
                            <div>
                                <label for="nearby-latitude" data-text="latitude"></label>
                                <input id="nearby-latitude" type="text" inputmode="decimal" maxlength="24"
                                    autocomplete="off" dir="ltr" aria-describedby="coordinate-hint">
                            </div>
                            <div>
                                <label for="nearby-longitude" data-text="longitude"></label>
                                <input id="nearby-longitude" type="text" inputmode="decimal" maxlength="24"
                                    autocomplete="off" dir="ltr" aria-describedby="coordinate-hint">
                            </div>
                        </div>
                        <p id="coordinate-hint" class="setup-hint" data-text="coordinateHint"></p>
                        <p id="location-hint" class="setup-hint" data-text="locationHint"></p>
                        <label for="nearby-radius" data-text="radiusLabel"></label>
                        <select id="nearby-radius">
                            <option value="2">2 km</option>
                            <option value="5">5 km</option>
                            <option value="10">10 km</option>
                        </select>
                        <p id="location-status" class="setup-status" role="status"></p>
                    </div>
                    <div id="station-source-settings" hidden>
                        <form id="station-search" role="search" aria-labelledby="station-query-label">
                            <label id="station-query-label" for="station-query" data-text="stationSearchLabel"></label>
                            <div class="search-row">
                                <input id="station-query" type="search" inputmode="numeric" pattern="[0-9]*"
                                    maxlength="18" dir="ltr" autocomplete="off"
                                    aria-describedby="station-search-hint">
                                <button type="submit" data-text="search"></button>
                            </div>
                            <p id="station-search-hint" class="setup-hint" data-text="stationSearchHint"></p>
                        </form>
                        <p id="station-search-status" class="setup-status" role="status"></p>
                        <p id="selected-station" class="selected-station" role="status"></p>
                    </div>
                </section>
                <section class="setup-section" aria-labelledby="view-heading">
                    <h2 id="view-heading" data-text="displayViewLabel"></h2>
                    <div class="setup-choice-buttons setup-view-buttons" role="group" aria-labelledby="view-heading">
                        <button id="view-today" type="button" data-text="displayViewToday" aria-pressed="true"></button>
                        <button id="view-latest" type="button" data-text="displayViewLatest" aria-pressed="false"></button>
                    </div>
                    <div id="collage-limit-settings">
                        <label for="collage-limit" data-text="collageLimitLabel"></label>
                        <select id="collage-limit"></select>
                    </div>
                </section>
                <section class="setup-section language-choice">
                    <label for="display-language" data-text="languageLabel"></label>
                    <select id="display-language">
                        <option value="auto" data-text="automaticLanguage"></option>
                        <option value="en" lang="en">English</option>
                        <option value="nl" lang="nl">Nederlands</option>
                        <option value="fr" lang="fr">Français</option>
                        <option value="de" lang="de">Deutsch</option>
                        <option value="es" lang="es">Español</option>
                        <option value="it" lang="it">Italiano</option>
                        <option value="pt-BR" lang="pt-BR">Português (Brasil)</option>
                    </select>
                </section>
                <section class="setup-section night-choice">
                    <label class="night-toggle" for="night-enabled">
                        <input id="night-enabled" type="checkbox" aria-controls="night-times">
                        <span data-night-text="enabled"></span>
                    </label>
                    <div id="night-times" hidden>
                        <div class="night-time-row">
                            <div>
                                <label for="night-start" data-night-text="start"></label>
                                <input id="night-start" type="time" maxlength="5" placeholder="22:00"
                                    aria-describedby="night-hint night-status">
                            </div>
                            <div>
                                <label for="night-end" data-night-text="end"></label>
                                <input id="night-end" type="time" maxlength="5" placeholder="07:00"
                                    aria-describedby="night-hint night-status">
                            </div>
                        </div>
                        <p id="night-hint" class="setup-hint" data-night-text="hint"></p>
                    </div>
                    <p id="night-status" class="setup-status" role="status"></p>
                </section>
                <div class="setup-actions">
                    <button id="save-settings" type="button" disabled></button>
                </div>
                <details id="setup-guide" class="setup-guide">
                    <summary data-text="guideTitle"></summary>
                    <div class="setup-guide-content">
                        <img src="assets/field-sprig.svg" alt="">
                        <ol>
                            <li data-text="guideHomeScreen"></li>
                            <li data-text="guideAutoLock"></li>
                            <li data-text="guidePower"></li>
                        </ol>
                    </div>
                </details>
            </div>
            <footer class="setup-privacy" data-text="privacyNotice"></footer>
        </div>
    </main>
    <script src="assets/text.js"></script>
    <script src="assets/birdweather.js"></script>
    <script src="assets/night-schedule.js"></script>
    <script src="assets/night-text.js"></script>
    <script src="assets/preferences.js"></script>
    <script src="assets/setup.js"></script>
    <script src="assets/artwork.js"></script>
    <script src="assets/artwork-text.js"></script>
    <script src="assets/artwork-info.js"></script>
    <script src="assets/display-refresh.js"></script>
    <script src="assets/collage-zone-data.js"></script>
    <script src="assets/collage-day.js"></script>
    <script src="assets/collage-data.js"></script>
    <script src="assets/collage-layout.js"></script>
    <script src="assets/collage-view.js"></script>
    <script src="assets/painting.js"></script>
</body>
</html>
