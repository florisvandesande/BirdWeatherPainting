<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL settings browser test</title>
    <style>
        body { margin: 1rem; font: 16px/1.4 sans-serif; }
        iframe { display: block; width: min(100%, 1024px); height: 768px; border: 1px solid #777; }

    <script src="url-settings-test.js"></script>
</body>
</html>
