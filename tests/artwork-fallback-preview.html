<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base href="../">
    <title>Missing artwork perch fallback check</title>
    <link rel="stylesheet" href="assets/artwork.css">
    <style>
        body { margin: 1rem; color: #38281c; background: #f0ece6; font: 16px/1.4 system-ui, sans-serif; }
        main { display: flex; flex-wrap: wrap; gap: 2rem; }
        figure { width: min(42vw, 460px); margin: 0; }
        img { display: block; width: 100%; height: 300px; object-fit: contain; }
        figcaption { padding-top: 0.5rem; text-align: center; }
        #status { font-weight: 700; }
        @media (max-width: 700px) { figure { width: 100%; } img { height: 220px; } }
        @media (prefers-color-scheme: dark) { body { color: #f5e6cb; background: #271e17; } }
    </style>
</head>
<body>
    <h1>Unknown species should use a perch</h1>
    <p id="status" role="status">Loading the local artwork catalogue…</p>
    <main>
        <figure>
            <img id="single-art" alt="">
            <figcaption>Single-bird fallback</figcaption>
        </figure>
        <figure>
            <img id="collage-art" alt="">
            <figcaption>Collage fallback for Test woodpecker<br><i>Picus testii</i></figcaption>
        </figure>
    </main>
    <script src="assets/artwork.js"></script>
    <script>
    (function () {
        'use strict';
        var status = document.getElementById('status');
        var results = [];
        var species = { id: '987654321', commonName: 'Test woodpecker', scientificName: 'Picus testii' };

        function recordResult(label, image, credit, ready) {
            if (!credit) return;
            var passed = ready && credit && credit.kind === 'perch' &&
                /^assets\/artwork\/perches\/[a-z0-9_-]+\.png$/.test(credit.image) && image.naturalWidth > 0;
            results.push(passed ? null : label + ' did not load a local perch');
            if (results.length === 2) {
                var failures = results.filter(function (item) { return item; });
                status.textContent = failures.length ? 'FAIL: ' + failures.join('; ') :
                    'PASS: single and collage missing-art fallbacks use local perches';
                status.style.color = failures.length ? '#a32620' : '#176b36';
            }
        }

        window.BirdWeatherArtwork.paint(document.getElementById('single-art'), species, function (credit) {
            if (credit) recordResult('Single-bird view', document.getElementById('single-art'), credit, true);
        });
        window.BirdWeatherArtwork.paintCollage(document.getElementById('collage-art'), species, function (credit, ready) {
            if (ready) recordResult('Collage view', document.getElementById('collage-art'), credit, ready);
        });
    }());
    </script>
</body>
</html>
