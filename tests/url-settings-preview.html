<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL settings browser checks</title>
    <style>
        body { margin: 1rem; font: 15px/1.45 system-ui, sans-serif; color: #28231e; }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
        p { margin: 0.4rem 0; }
        #controls { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
        button { padding: 0.45rem 0.7rem; }
        #status { min-height: 1.5em; white-space: pre-wrap; }
        iframe { width: 100%; height: min(78vh, 900px); border: 1px solid #aaa; background: #f0ece6; }
        .pass { color: #176b36; }
        .fail { color: #a32620; }
        @media (prefers-color-scheme: dark) {
            body { background: #201d1a; color: #eee7df; }
            iframe { border-color: #777; }
        }
    </style>
</head>
<body>
    <h1>URL settings browser checks</h1>
    <p>These checks load the production page in the frame below. They temporarily seed obsolete settings so the bare URL can prove it ignores them. The fixture restores the previous values when this page closes.</p>
    <div id="controls">
        <button data-case="bare">Bare URL</button>
        <button data-case="valid">Complete URL + unknown field</button>
        <button data-case="partial">Partial URL prefill</button>
        <button data-case="missing-source">Missing source</button>
        <button data-case="invalid-station">Invalid station ID</button>
        <button data-case="invalid">Invalid values</button>
        <button data-case="duplicate">Duplicate known field</button>
        <button data-case="nearby">Nearby partial URL</button>
        <button data-case="blocked">Storage blocked</button>
        <button data-case="station-save">Save station URL</button>
        <button data-case="nearby-save">Save nearby URL</button>
        <button data-case="language-preview">Language preview</button>
        <button data-case="station-lookup">Station ID lookup</button>
        <button data-case="location-lookup">Location lookup</button>
        <button data-case="artwork">Artwork information</button>
        <button id="all">Run core checks</button>
    </div>
    <p id="status" role="status">Ready.</p>
    <iframe id="app" title="BirdWeather Painting preview"></iframe>
    <script>
    (function () {
        'use strict';
        var frame = document.getElementById('app');
        var status = document.getElementById('status');
        var savedStorage = Object.create(null);
        var storageKeys = ['birdweather.setup', 'birdweather.language'];
        var storageSeeded = false;
        var cases = {
            bare: { query: '', check: function (doc) {
                return visible(doc, 'setup') && !visible(doc, 'painting') &&
                    doc.getElementById('use-location').getAttribute('aria-pressed') === 'true' &&
                    visible(doc, 'nearby-source-settings') && !visible(doc, 'station-source-settings') &&
                    doc.getElementById('nearby-latitude').value === '' &&
                    doc.getElementById('nearby-longitude').value === '' &&
                    doc.getElementById('nearby-radius').value === '2' &&
                    doc.getElementById('view-today').getAttribute('aria-pressed') === 'true' &&
                    doc.getElementById('collage-limit').value === '12' &&
                    doc.getElementById('display-language').value === 'auto' &&
                    !doc.getElementById('night-enabled').checked &&
                    !doc.getElementById('setup-guide').open &&
                    !doc.getElementById('cancel-settings') &&
                    doc.querySelector('.setup-privacy').textContent.length > 0 &&
                    getComputedStyle(doc.querySelector('.setup-controls')).flexDirection === 'column' &&
                    getComputedStyle(doc.querySelector('.setup')).backgroundColor ===
                        getComputedStyle(doc.getElementById('artwork-info')).backgroundColor &&
                    doc.getElementById('url-config-status').textContent === '';
            } },
            valid: { query: '?source=station&station=7368&view=today&limit=12&lang=nl&night=0&nightStart=22%3A00&nightEnd=07%3A00&utm_source=fixture', check: function (doc) {
                return visible(doc, 'painting') && !visible(doc, 'setup') && doc.documentElement.lang === 'nl';
            } },
            partial: { query: '?source=station&station=7368&view=today&limit=4&lang=de&night=1&nightStart=21%3A15', check: function (doc) {
                return visible(doc, 'setup') && doc.getElementById('station-query').value === '7368' &&
                    doc.getElementById('station-mode-button').getAttribute('aria-pressed') === 'true' &&
                    doc.getElementById('selected-station').textContent.indexOf('7368') >= 0 &&
                    doc.getElementById('view-today').getAttribute('aria-pressed') === 'true' && doc.getElementById('collage-limit').value === '4' &&
                    doc.getElementById('display-language').value === 'de' && doc.getElementById('night-enabled').checked &&
                    doc.getElementById('night-start').value === '21:15' && doc.getElementById('night-end').value === '07:00' &&
                    doc.getElementById('url-config-status').textContent.length > 0;
            } },
            'missing-source': { query: '?station=7368&view=latest&limit=12&lang=auto&night=0&nightStart=22%3A00&nightEnd=07%3A00', check: function (doc) {
                return visible(doc, 'setup') && doc.getElementById('use-location').getAttribute('aria-pressed') === 'true' &&
                    visible(doc, 'nearby-source-settings') && !visible(doc, 'station-source-settings') &&
                    doc.getElementById('view-latest').getAttribute('aria-pressed') === 'true';
            } },
            'invalid-source': { query: '?source=invalid&view=today&limit=12&lang=auto&night=0&nightStart=22%3A00&nightEnd=07%3A00', check: function (doc) {
                return visible(doc, 'setup') && doc.getElementById('use-location').getAttribute('aria-pressed') === 'false' &&
                    doc.getElementById('station-mode-button').getAttribute('aria-pressed') === 'false' &&
                    doc.getElementById('save-settings').disabled && doc.getElementById('url-config-status').textContent.length > 0;
            } },
            'invalid-station': { query: '?source=station&station=0&view=latest&limit=12&lang=auto&night=0&nightStart=22%3A00&nightEnd=07%3A00', check: function (doc) {
                return visible(doc, 'setup') && doc.getElementById('station-mode-button').getAttribute('aria-pressed') === 'true' &&
                    doc.getElementById('station-query').value === '' &&
                    doc.getElementById('selected-station').textContent === '' &&
                    doc.getElementById('station-search-status').textContent.length > 0 &&
                    doc.getElementById('save-settings').disabled;
            } },
            invalid: { query: '?source=station&station=7368&view=bad&limit=33&lang=xx&night=2&nightStart=22%3A00&nightEnd=22%3A00', check: function (doc) {
                return visible(doc, 'setup') && doc.getElementById('view-today').getAttribute('aria-pressed') === 'true' &&
                    doc.getElementById('collage-limit').value === '12' && doc.getElementById('display-language').value === 'auto' &&
                    doc.getElementById('night-start').value === '22:00' && doc.getElementById('night-end').value === '07:00' &&
                    doc.getElementById('url-config-status').textContent.length > 0;
            } },
            duplicate: { query: '?source=station&station=7368&view=latest&view=today&limit=8&lang=auto&night=0&nightStart=22%3A00&nightEnd=07%3A00', check: function (doc) {
                return visible(doc, 'setup') && doc.getElementById('view-today').getAttribute('aria-pressed') === 'true';
            } },
            nearby: { query: '?source=nearby&lat=52.12345&lon=bad&radius=7&view=latest&limit=12&lang=auto&night=0&nightStart=22%3A00&nightEnd=07%3A00', check: function (doc) {
                return visible(doc, 'setup') && doc.getElementById('nearby-latitude').value === '52.12345' &&
                    doc.getElementById('nearby-longitude').value === '' && doc.getElementById('nearby-radius').value === '2' &&
                    doc.getElementById('nearby-longitude').getAttribute('aria-invalid') === 'true';
            } }
        };

        function visible(doc, id) {
            var element = doc.getElementById(id);
            return !!element && !element.hidden;
        }

        function seedLegacySettings() {
            try {
                storageKeys.forEach(function (key) { savedStorage[key] = window.localStorage.getItem(key); });
                window.localStorage.setItem('birdweather.setup', JSON.stringify({
                    source: 'station', station: '8089', view: 'today', limit: '32',
                    night: { enabled: false, start: null, end: null }
                }));
                window.localStorage.setItem('birdweather.language', 'de');
                storageSeeded = true;
            } catch (error) {
                status.textContent = 'Browser storage is unavailable to the parent fixture; URL cases can still run.';
            }
        }

        function restoreLegacySettings() {
            if (!storageSeeded) return;
            storageKeys.forEach(function (key) {
                try {
                    if (savedStorage[key] === null) window.localStorage.removeItem(key);
                    else window.localStorage.setItem(key, savedStorage[key]);
                } catch (error) { /* Keep closing the fixture even if browser storage is blocked. */ }
            });
        }

        function showResult(label, passed, detail) {
            status.className = passed ? 'pass' : 'fail';
            status.textContent = (passed ? 'PASS: ' : 'FAIL: ') + label + (detail ? ' — ' + detail : '');
        }

        function openCase(name, complete) {
            var test = cases[name];
            frame.onload = function () {
                frame.onload = null;
                try {
                    var doc = frame.contentDocument;
                    var passed = test.check(doc);
                    if (complete) complete(passed, name);
                    else showResult(name, passed);
                } catch (error) {
                    if (complete) complete(false, name + ': ' + error.message);
                    else showResult(name, false, error.message);
                }
            };
            frame.src = '../index.html' + test.query;
        }

        function change(element, value) {
            element.value = value;
            var event = element.ownerDocument.createEvent('Event');
            event.initEvent('change', true, false);
            element.dispatchEvent(event);
        }

        function chooseView(doc, id) {
            doc.getElementById(id).click();
        }

        function runSave(kind) {
            var nearby = kind === 'nearby-save';
            var query = nearby ? '?source=nearby&lat=52.1234567&lon=5.7654321&radius=10' :
                '?source=station&station=7368';
            var initialSearch = new URL(query, window.location.href).search;
            var expected = nearby ?
                '?source=nearby&lat=52.12346&lon=5.76543&radius=10&view=latest&limit=9&lang=auto&night=0&nightStart=22%3A00&nightEnd=07%3A00' :
                '?source=station&station=7368&view=today&limit=4&lang=nl&night=1&nightStart=21%3A30&nightEnd=06%3A45';
            var firstLoad = true;
            frame.onload = function () {
                try {
                    if (firstLoad && frame.contentWindow.location.search !== initialSearch) return;
                    var doc = frame.contentDocument;
                    if (!firstLoad) {
                        showResult(kind, frame.contentWindow.location.search === expected && visible(doc, 'painting') &&
                            !visible(doc, 'setup'), frame.contentWindow.location.search);
                        frame.onload = null;
                        return;
                    }
                    firstLoad = false;
                    if (!visible(doc, 'setup')) throw new Error('incomplete URL did not open setup');
                    if (nearby) {
                        chooseView(doc, 'view-latest');
                        change(doc.getElementById('collage-limit'), '9');
                        doc.getElementById('night-start').value = '';
                        doc.getElementById('night-end').value = '';
                        doc.getElementById('save-settings').click();
                    } else {
                        chooseView(doc, 'view-today');
                        change(doc.getElementById('collage-limit'), '4');
                        change(doc.getElementById('display-language'), 'nl');
                        doc.getElementById('night-enabled').checked = true;
                        doc.getElementById('night-enabled').dispatchEvent(new Event('change', { bubbles: true }));
                        doc.getElementById('night-start').value = '21:30';
                        doc.getElementById('night-end').value = '06:45';
                        doc.getElementById('save-settings').click();
                    }
                } catch (error) {
                    frame.onload = null;
                    showResult(kind, false, error.message);
                }
            };
            frame.src = '../index.html' + query;
        }

        function runLanguagePreview() {
            frame.onload = function () {
                frame.onload = null;
                var doc = frame.contentDocument;
                doc.getElementById('open-settings').click();
                change(doc.getElementById('display-language'), 'en');
                showResult('language preview stays unsaved until save',
                    doc.getElementById('setup-title').textContent === 'BirdWeather Painting' &&
                    frame.contentWindow.location.search.indexOf('lang=nl') >= 0 &&
                    !doc.getElementById('cancel-settings'));
            };
            frame.src = '../index.html?source=station&station=7368&view=latest&limit=12&lang=nl&night=0&nightStart=22%3A00&nightEnd=07%3A00';
        }

        function runStationLookup() {
            frame.onload = function () {
                frame.onload = null;
                var doc = frame.contentDocument;
                var win = frame.contentWindow;
                win.BirdWeatherApi.searchStations = function (id, complete) {
                    window.setTimeout(function () {
                        complete(null, [{ id: id, name: 'Fixture station' }]);
                    }, 0);
                    return { abort: function () {} };
                };
                doc.getElementById('station-query').value = '12345';
                var input = doc.createEvent('Event');
                input.initEvent('input', true, false);
                doc.getElementById('station-query').dispatchEvent(input);
                doc.getElementById('station-search').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
                window.setTimeout(function () {
                    showResult('station ID auto-selects an exact match',
                        doc.getElementById('selected-station').textContent.indexOf('Fixture station') >= 0 &&
                        doc.getElementById('save-settings').disabled === false);
                }, 10);
            };
            frame.src = '../index.html?source=station&station=0&view=today&limit=12&lang=en&night=0&nightStart=22%3A00&nightEnd=07%3A00';
        }

        function runLocationLookup() {
            frame.onload = function () {
                frame.onload = null;
                var doc = frame.contentDocument;
                var win = frame.contentWindow;
                Object.defineProperty(win.navigator, 'geolocation', { configurable: true, value: {
                    getCurrentPosition: function (success) {
                        success({ coords: { latitude: 52.123, longitude: 5.456 } });
                    }
                } });
                doc.getElementById('use-location').click();
                showResult('location button selects nearby and fills editable coordinates',
                    doc.getElementById('use-location').getAttribute('aria-pressed') === 'true' &&
                    doc.getElementById('nearby-latitude').value === '52.123' &&
                    doc.getElementById('nearby-longitude').value === '5.456' &&
                    doc.getElementById('location-status').textContent.length > 0);
            };
            frame.src = '../index.html';
        }

        function runArtwork() {
            frame.onload = function () {
                frame.onload = null;
                var doc = frame.contentDocument;
                doc.getElementById('artwork-button').click();
                showResult('daily bird list and Fugleramme attribution are present',
                    !!doc.getElementById('artwork-birds') && !!doc.getElementById('artwork-status') &&
                    !!doc.querySelector('.artwork-attribution a[href*="github.com/arnegiacomo/fugleramme"]') &&
                    visible(doc, 'artwork-info'));
            };
            frame.src = '../index.html?source=station&station=7368&view=latest&limit=12&lang=auto&night=0&nightStart=22%3A00&nightEnd=07%3A00';
        }

        function openStorageBlocked() {
            fetch('../index.html').then(function (response) { return response.text(); }).then(function (html) {
                var bootstrap = '<base href="' + new URL('../', window.location.href).href + '">' +
                    '<script>Object.defineProperty(window,"localStorage",{configurable:true,get:function(){throw new Error("storage blocked by fixture");}});' +
                    'var oldOpen=XMLHttpRequest.prototype.open,oldSend=XMLHttpRequest.prototype.send;' +
                    'XMLHttpRequest.prototype.open=function(method,address){this._testAddress=address;return oldOpen.apply(this,arguments);};' +
                    'XMLHttpRequest.prototype.send=function(){if(/^https:\\/\\/graphql\\.birdweather\\.com/.test(this._testAddress)){var request=this;setTimeout(function(){if(request.onerror)request.onerror();},0);return;}return oldSend.apply(this,arguments);};<\/script>';
                html = html.replace('<head>', '<head>' + bootstrap);
                frame.onload = function () {
                    frame.onload = null;
                    try {
                        var doc = frame.contentDocument;
                        showResult('blocked storage', visible(doc, 'setup') && !visible(doc, 'painting'),
                            'setup loads while localStorage access throws');
                    } catch (error) { showResult('blocked storage', false, error.message); }
                };
                frame.srcdoc = html;
            }).catch(function (error) { showResult('blocked storage', false, error.message); });
        }

        function runAll() {
            var names = ['bare', 'valid', 'partial', 'missing-source', 'invalid-source', 'invalid-station', 'invalid', 'duplicate', 'nearby'];
            var failures = [];
            var index = 0;
            function next() {
                if (index >= names.length) {
                    showResult('core URL cases ' + names.length, failures.length === 0,
                        failures.length ? failures.join(', ') : 'all passed');
                    return;
                }
                var name = names[index++];
                openCase(name, function (passed, label) {
                    if (!passed) failures.push(label);
                    next();
                });
            }
            next();
        }

        seedLegacySettings();
        window.addEventListener('unload', restoreLegacySettings);
        document.querySelectorAll('[data-case]').forEach(function (button) {
            button.addEventListener('click', function () {
                var name = button.getAttribute('data-case');
                if (cases[name]) openCase(name);
                else if (name === 'blocked') openStorageBlocked();
                else if (name === 'station-save' || name === 'nearby-save') runSave(name);
                else if (name === 'language-preview') runLanguagePreview();
                else if (name === 'station-lookup') runStationLookup();
                else if (name === 'location-lookup') runLocationLookup();
                else if (name === 'artwork') runArtwork();
            });
        });
        document.getElementById('all').addEventListener('click', runAll);
        openCase('bare');
        var requestedRun = new URLSearchParams(window.location.search).get('run');
        if (requestedRun) {
            window.setTimeout(function () {
                var button = document.querySelector('[data-case="' + requestedRun + '"]') ||
                    (requestedRun === 'all' ? document.getElementById('all') : null);
                if (button) button.click();
            }, 0);
        }
    }());
    </script>
</body>
</html>
