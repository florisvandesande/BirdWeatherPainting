<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>BirdWeather Painting</title>
    <link rel="stylesheet" href="assets/painting.css">
    <link rel="stylesheet" href="assets/artwork.css">
</head>
<body>
    <main id="painting" class="painting" aria-labelledby="plate-title">
        <header class="plate-header">
            <p class="book-title" data-text="title"></p>
            <p id="station-name" class="station-name" dir="auto"></p>
        </header>
        <section class="plate-content">
            <img id="latest-art" class="plate-art" src="assets/field-sprig.svg" alt="">
            <div class="plate-caption" aria-live="polite">
                <h1 id="plate-title" dir="auto"></h1>
                <p id="plate-detail" dir="auto"></p>
                <p id="detection-time" hidden><time></time></p>
            </div>
        </section>
        <footer class="plate-footer">
            <p id="observation-note" hidden></p>
            <p id="connection-status" role="status"></p>
        </footer>
        <button type="button" id="artwork-button" class="artwork-button" aria-controls="artwork-info" aria-expanded="false">i</button>
        <section id="artwork-info" class="artwork-info" role="dialog" aria-modal="true" aria-labelledby="artwork-title" hidden>
            <div class="artwork-sheet">
                <button type="button" id="artwork-close" data-artwork-text="back"></button>
                <h2 id="artwork-title" data-artwork-text="title"></h2>
                <h3 data-artwork-text="displayed"></h3>
                <div id="artwork-displayed"></div>
                <h3 id="artwork-missing-title" data-artwork-text="missing"></h3>
                <p id="artwork-missing-empty" data-artwork-text="missingEmpty"></p>
                <p id="artwork-copy-help" data-artwork-text="copyHelp" hidden></p>
                <textarea id="artwork-missing" aria-labelledby="artwork-missing-title" dir="auto" readonly hidden></textarea>
                <button type="button" id="artwork-select" data-artwork-text="select" hidden></button>
                <h3 data-artwork-text="local"></h3>
                <div id="artwork-local"></div>
            </div>
        </section>
    </main>
    <script src="assets/text.js"></script>
    <script src="assets/birdweather.js"></script>
    <script src="assets/artwork.js"></script>
    <script src="assets/artwork-text.js"></script>
    <script src="assets/artwork-info.js"></script>
    <script src="assets/painting.js"></script>
</body>
</html>
