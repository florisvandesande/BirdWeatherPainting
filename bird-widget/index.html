<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Get the latest bird from station</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Georgia, "Times New Roman", serif;
            background: #f0ece6;
            color: #392719;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                background: #211d19;
                color: #f0ece6;
            }
        }

        body {
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding: clamp(24px, 7vw, 80px);
            display: grid;
            place-items: center;
        }

        main {
            width: min(100%, 540px);
            text-align: center;
        }

        .bird {
            width: min(100%, 440px);
            margin: 32px auto 0;
        }

        .bird-image {
            display: block;
            width: 100%;
            height: min(58vh, 480px);
            object-fit: contain;
        }

    </style>
</head>
<body>
    <main>
        <div id="bird"></div>
    </main>
    <script src="bird-widget.js" defer></script>
</body>
</html>
