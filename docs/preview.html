<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BirdWeather Painting visual preview</title>
    <link rel="stylesheet" href="../assets/painting.css">
    <link rel="stylesheet" href="../assets/setup.css">
    <link rel="stylesheet" href="../assets/artwork.css">
</head>
<body>
    <main class="painting" aria-labelledby="plate-title">
        <header class="plate-header">
            <p class="book-title">BirdWeather Painting</p>
        <p class="station-name">Sample artwork</p>
        </header>
        <section class="plate-content">
            <img class="plate-art" src="../assets/artwork/birds/archilochus-colubris.png" alt="Ruby-throated Hummingbird illustration">
            <div class="plate-caption">
                <h1 id="plate-title">Ruby-throated Hummingbird</h1>
                <p class="scientific-name">Archilochus colubris</p>
                <p>Sample layout · not a live detection</p>
            </div>
        </section>
        <footer class="plate-footer">
            <p>Sample painting layout · not a live detection.</p>
        </footer>
        <button class="painting-settings" type="button" aria-label="Settings preview">Settings</button>
        <button type="button" class="artwork-button" aria-label="Artwork information preview">i</button>
    </main>
</body>
</html>
